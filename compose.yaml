name: talent

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: talent-postgres
    environment:
      POSTGRES_DB: talent
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: talent
    ports:
      - "5433:5432"
    volumes:
      - talent-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: talent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - talent-minio-data:/data

  minio-init:
    image: minio/mc
    container_name: talent-minio-init
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
             mc mb --ignore-existing local/talent-resumes"

  elasticmq:
    image: softwaremill/elasticmq-native
    container_name: talent-elasticmq
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf

volumes:
  talent-postgres-data:
  talent-minio-data:
