spring:
  application:
    name: spring-talent-engine
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/talent}
    username: ${DB_APP_USERNAME:talent_app}
    password: ${DB_APP_PASSWORD:talent_app}
  flyway:
    url: ${spring.datasource.url}
    user: ${DB_USERNAME:talent}
    password: ${DB_PASSWORD:talent}
    placeholders:
      "[app_user]": ${DB_APP_USERNAME:talent_app}
      "[app_password]": ${DB_APP_PASSWORD:talent_app}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
          principal-claim-name: ${AUTH0_EMAIL_CLAIM:https://spring-talent-engine/email}
  ai:
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${LLM_BASE_URL}
      api-key: ${LLM_API_KEY}
      chat:
        model: ${LLM_MODEL}
        temperature: 0.0

  modulith:
    events:
      republish-outstanding-events-on-restart: true

app:
  storage:
    bucket: ${STORAGE_BUCKET:talent-resumes}
  queue:
    screening: ${SCREENING_QUEUE:resume-screening}
    concurrency: ${SCREENING_CONCURRENCY:2}
  github:
    token: ${GITHUB_TOKEN:}
  byok:
    master-key: ${BYOK_MASTER_KEY}
    salt: ${BYOK_SALT:8f3c2a7d5e1b9046}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
