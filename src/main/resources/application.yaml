spring:
  application:
    name: spring-talent-engine
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/talent}
    username: ${DB_APP_USERNAME:talent_app}
    password: ${DB_APP_PASSWORD:talent_app}
  flyway:
    url: ${spring.datasource.url}
    user: ${DB_USERNAME:talent}
    password: ${DB_PASSWORD:talent}
    placeholders:
      "[app_user]": ${DB_APP_USERNAME:talent_app}
      "[app_password]": ${DB_APP_PASSWORD:talent_app}
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
          principal-claim-name: ${AUTH0_EMAIL_CLAIM:https://spring-talent-engine/email}
  ai:
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${LLM_BASE_URL}
      api-key: ${LLM_API_KEY}
      chat:
        options:
          model: ${LLM_MODEL}
          temperature: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
